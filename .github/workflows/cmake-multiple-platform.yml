name: CMake build + test on multiple platforms

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-latest
            no_windows: ON
            c_compiler: gcc
            cpp_compiler: g++
          - os: windows-latest
            no_windows: OFF
            c_compiler: MSVC
            cpp_compiler: MSVC
          - os: macos-latest
            no_windows: ON
            c_compiler: gcc-15
            cpp_compiler: g++-15

    steps:
    - uses: actions/checkout@v4
  
    - name: Update submodules
      run: git submodule update --init --recursive

    - name: Add Windows SDK dir to PATH (for dxc)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $dxcPath = 'C:/Program Files (x86)/Windows Kits/10/bin/10.0.26100.0/x64'
        if (Test-Path $dxcPath) {
          Write-Host "Adding $dxcPath to PATH for remaining steps"
          Add-Content -Path $env:GITHUB_PATH -Value $dxcPath
        } else {
          Write-Host "Warning: $dxcPath not found; skipping PATH update"
        }

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DNO_WINDOWS:STRING="${{ matrix.no_windows }}"

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure --debug
