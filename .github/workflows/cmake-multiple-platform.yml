name: CMake build + test on multiple platforms

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: windows-latest
            c_compiler: MSVC
            cpp_compiler: MSVC
          - os: macos-latest
            c_compiler: gcc-15
            cpp_compiler: g++-15

    steps:
    - uses: actions/checkout@v4
  
    - name: Update submodules
      run: git submodule update --init --recursive

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure --debug

    - name: Dump macOS crash reports
      # SampleTest.Rendering crashes with SIGABRT on macOS; the .ips crash
      # report holds the crashing stack. See ~/Library/Logs/DiagnosticReports.
      if: failure() && runner.os == 'macOS'
      run: |
        echo "--- dynamic libraries of the crashed binary ---"
        otool -L "${{github.workspace}}/build/PathTracer" || true
        reports="$HOME/Library/Logs/DiagnosticReports"
        newest=$(ls -t "$reports"/PathTracer*.ips 2>/dev/null | head -2)
        if [ -z "$newest" ]; then
          echo "No PathTracer crash reports found; newest reports in $reports:"
          ls -t "$reports" 2>/dev/null | head -5
        else
          for f in $newest; do
            echo "=== $f ==="
            cat "$f"
          done
        fi
